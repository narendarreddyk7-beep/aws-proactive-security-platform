[project]
name = "aws-proactive-security-platform"
version = "1.0.0"
description = "Multi-tenant customer support API on AWS with proactive application security engineering, threat modeling, and automated risk remediation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "mangum>=0.19",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "checkov>=3.2",
    "jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The deployable Lambda package root is `application/`; `security-automation/` is
# tooling that ships with the repository but is not part of the Lambda artifact.
package-dir = { "" = "application" }

[tool.setuptools.packages.find]
where = ["application"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting (replaces flake8/isort/black for this project)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["application", "security-automation", "tests"]
exclude = [".venv", "build", "dist", "reports", ".terraform"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modern syntax)
    "S",   # flake8-bandit (security lint inside ruff)
    "A",   # flake8-builtins (shadowing builtins)
    "T20", # flake8-print (no stray print in app code)
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # unused arguments
    "PTH", # prefer pathlib
    "ANN", # type annotations required on public functions
]
ignore = [
    "ANN401", # allow typing.Any where a boundary genuinely accepts anything
    "B008",   # FastAPI dependency-injection idiom: Depends() in defaults
    "SIM108", # ternary rewrite is not always clearer
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts, hardcoded synthetic secrets, and loose typing.
"tests/**/*.py" = ["S101", "S105", "S106", "ANN", "ARG", "S311"]
"security-automation/tests/**/*.py" = ["S101", "S105", "S106", "ANN", "ARG"]
# CLI tools intentionally write to stdout.
"security-automation/*.py" = ["T20"]
"scripts/*.py" = ["T20", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "security_automation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# `application` so `import app...` works; repo root so `security-automation`
# modules can be imported by path-based test helpers.
pythonpath = ["application", "."]
testpaths = ["tests", "security-automation/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: isolated component tests with mocked collaborators",
    "integration: multi-component tests through the ASGI/HTTP boundary",
    "security: tests that assert a security invariant or guard a fixed finding",
    "regression: guards a specific documented security finding (see assessments/)",
    "aws: requires real AWS credentials and deployed infrastructure; skipped by default",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

# ---------------------------------------------------------------------------
# Bandit: Python SAST. Tests are excluded (asserts/synthetic secrets by design).
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "security-automation/tests", ".venv", "build", "reports"]
# B101 (assert_used) is excluded repo-wide because the only asserts in shipped
# code are fail-closed configuration guards, which are reviewed individually.
skips = []

[tool.coverage.run]
source = ["application/app", "security-automation"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
