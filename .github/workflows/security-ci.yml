# ---------------------------------------------------------------------------
# Security CI — 5 gated stages.
#
# This pipeline is mirrored by `scripts/run_security_checks.sh`, which runs the
# same tools in the same order with the same gating. A developer can reproduce
# a CI failure locally without pushing; if the script passes and CI fails, the
# two have drifted and that is a bug in the pipeline.
#
# GATING PHILOSOPHY
# -----------------
# Nothing is auto-suppressed and there is no `continue-on-error` on any security
# step. A green check means every scanner actually passed, not that every
# scanner ran. Where a finding is genuinely not applicable, it is suppressed
# inline, scoped to one check on one resource, with a written justification
# referencing an accepted-risk ID in assessments/final-security-assessment.md.
# There is deliberately no Checkov baseline file and no blanket --skip-check,
# because both make the number of suppressed findings invisible.
#
# SUPPLY CHAIN
# ------------
# Every security scanner is installed from PyPI inside the job rather than
# wrapped in a marketplace action, so the action surface stays small: GitHub's
# own `actions/*` and `github/codeql-action/*`, plus HashiCorp's official
# `hashicorp/setup-terraform` -- which is the one non-GitHub action here and is
# used only to place a binary on PATH.
#
# On action pinning: Anthropic's recommended practice is to pin actions to an
# immutable commit SHA. The SHAs are not pinned here because the build
# environment in which this file was authored has no GitHub API access, and
# writing SHAs that could not be verified would be worse than using tags --
# an unverifiable 40-character hex string looks more trustworthy than a tag
# while offering less. Convert them before relying on this in production:
#
#   for a in actions/checkout@v5 actions/setup-python@v6 \
#            actions/upload-artifact@v4 github/codeql-action@v3; do
#     repo="${a%@*}"; tag="${a#*@}"
#     gh api "repos/$repo/commits/$tag" --jq "\"$repo@\" + .sha + \"  # $tag\""
#   done
#
# This gap is recorded as limitation L3 in
# assessments/final-security-assessment.md.
# ---------------------------------------------------------------------------
name: Security CI

on:
  push:
    branches: [main]
  pull_request:
    # `pull_request` (NOT `pull_request_target`) is deliberate: a fork PR runs
    # with a read-only token and no access to repository secrets, so untrusted
    # code cannot exfiltrate credentials or write to the repository. There is
    # no deployment job in this workflow at all -- deploying is a separate,
    # manually-triggered workflow gated on branch protection.
    branches: [main]
  schedule:
    # Weekly, so a newly-published advisory against an unchanged dependency is
    # still found. Monday 07:17 UTC -- off the hour to avoid the scheduling peak.
    - cron: '17 7 * * 1'
  workflow_dispatch:

# Deny by default; each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # =========================================================================
  # STAGE 1 — Code quality
  # =========================================================================
  code-quality:
    name: 'Stage 1 · Code quality'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        # Ruff is configured with the `S` (bandit-equivalent) and `ANN`
        # (type annotation) rule sets -- see pyproject.toml. A lint failure
        # here can therefore be a security finding, not only style.
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Python syntax and import check
        run: |
          python -m compileall -q application/ security-automation/ scripts/
          python -c 'from app.main import app, handler; print("app imports cleanly")'
        env:
          PYTHONPATH: application

  # =========================================================================
  # STAGE 2 — Application security
  # =========================================================================
  codeql:
    name: 'Stage 2a · CodeQL'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload the SARIF results
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # `security-extended` over the default `security` pack: the extra
          # queries include taint-tracking rules that are relevant to a
          # request-handling service.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:python

  sast:
    name: 'Stage 2b · Bandit (SAST)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: python -m pip install 'bandit[toml]>=1.8'

      - name: Bandit — machine-readable report
        # `|| true` applies ONLY to report generation, so the artifact is
        # produced even when findings exist. The gate is the next step.
        run: |
          mkdir -p reports
          python -m bandit -c pyproject.toml -r application/ security-automation/ \
            -f json -o reports/bandit.json || true

      - name: Bandit — gate on medium severity and above
        # -ll = report medium and high only. LOW findings stay visible in the
        # JSON report above rather than being silenced with `# nosec`; the
        # repository's `nosec` count is 0 and should stay that way.
        run: |
          python -m bandit -c pyproject.toml -r application/ security-automation/ -ll

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json
          retention-days: 30

  dependency-audit:
    name: 'Stage 2c · pip-audit (SCA)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: python -m pip install 'pip-audit>=2.7'

      - name: Audit runtime dependencies
        # Audited against the LOCK, which is what actually ships to Lambda.
        run: |
          mkdir -p reports
          python -m pip_audit --requirement application/requirements.lock \
            --format json --output reports/pip-audit.json || true
          python -m pip_audit --requirement application/requirements.lock --strict

      - name: Lock file is in sync with requirements.txt
        # A lock that has drifted from its source is a lock nobody can trust:
        # the audited tree and the deployed tree stop being the same thing.
        # Recompile and diff rather than relying on a developer remembering.
        run: |
          python -m pip install --quiet 'pip-tools>=7.4'
          python -m piptools compile --generate-hashes --strip-extras --quiet \
            --output-file /tmp/requirements.lock.check application/requirements.txt
          if ! diff <(grep -v '^#' application/requirements.lock) \
                    <(grep -v '^#' /tmp/requirements.lock.check); then
            echo "::error::application/requirements.lock is stale. Regenerate it with:"
            echo "::error::python -m piptools compile --generate-hashes --strip-extras --output-file application/requirements.lock application/requirements.txt"
            exit 1
          fi
          echo "Lock file is in sync."
        shell: bash

      - name: Audit development dependencies
        # Dev dependencies do not reach production, but they execute in CI with
        # repository context, so an advisory here still matters.
        run: |
          python - <<'PY' > reports/dev-requirements.txt
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          print("\n".join(data["project"]["optional-dependencies"]["dev"]))
          PY
          python -m pip_audit --requirement reports/dev-requirements.txt --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          retention-days: 30

  # =========================================================================
  # STAGE 3 — Infrastructure security
  # =========================================================================
  infrastructure-security:
    name: 'Stage 3 · Infrastructure security'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tooling
        run: python -m pip install 'checkov>=3.2'

      - uses: hashicorp/setup-terraform@v3
        id: setup-terraform
        continue-on-error: true   # see the note in the next step
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Terraform fmt and validate
        # `continue-on-error` is set on the SETUP step only, so that a runner
        # unable to download the Terraform binary does not silently skip this
        # check -- it fails here instead, loudly, with the reason. This is the
        # one place the sandbox that authored this repo could not verify
        # (limitation L2): releases.hashicorp.com is outside its egress
        # allow-list.
        run: |
          if [ "${{ steps.setup-terraform.outcome }}" != "success" ]; then
            echo "::error::Terraform could not be installed; fmt/validate did not run."
            exit 1
          fi
          terraform fmt -check -recursive
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate

      - name: HCL reference linter (project tool)
        # Catches undeclared variables/locals/resources, missing module inputs,
        # hardcoded account ids and credential-shaped literals. Complements
        # `terraform validate` rather than replacing it -- it does not check
        # provider schemas, and says so in its own output.
        run: |
          python scripts/validate_terraform.py infrastructure/terraform
          python scripts/validate_terraform.py infrastructure/modules/security_hub_triage

      - name: Checkov
        run: |
          mkdir -p reports
          # Checkov treats --output-file-path as a DIRECTORY, so the JSON
          # report is captured from stdout instead.
          python -m checkov.main -d infrastructure/ --framework terraform \
            --output json --quiet > reports/checkov.json 2>/dev/null || true
          python -m checkov.main -d infrastructure/ --framework terraform \
            --compact --quiet --output cli

      - name: IAM policy analyzer (project tool)
        # Gates the policy documents that ACTUALLY deploy. The policies are
        # committed as JSON templates rather than rendered only by the provider
        # at plan time, precisely so this check is possible without AWS
        # credentials and with no hand-maintained copy to drift.
        run: |
          python security-automation/iam_policy_checker.py \
            --input infrastructure/terraform/policies/ \
            --output reports/iam-findings.json \
            --fail-on high

      - name: IAM analyzer gate self-test
        # A gate that has never rejected anything is not a verified gate. The
        # synthetic insecure fixture MUST be rejected; if it passes, the gate
        # is broken and this job fails even though the real policies are clean.
        run: |
          if python security-automation/iam_policy_checker.py \
               --input sample-data/insecure-policy.json --fail-on high >/dev/null 2>&1; then
            echo "::error::The insecure fixture passed. The IAM gate is not working."
            exit 1
          fi
          echo "Confirmed: the insecure fixture is correctly rejected."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-reports
          path: |
            reports/checkov.json
            reports/iam-findings.json
          retention-days: 30

  # =========================================================================
  # STAGE 4 — Automated testing
  # =========================================================================
  tests:
    name: 'Stage 4 · Tests (${{ matrix.suite }})'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false   # report every failing suite, not just the first
      matrix:
        suite: [unit, integration, security, regression]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run ${{ matrix.suite }} suite
        # No AWS credentials are configured, so the `aws`-marked tests skip
        # with a named prerequisite rather than failing or being absent.
        run: python -m pytest -m ${{ matrix.suite }} -q --no-header

  coverage:
    name: 'Stage 4e · Full suite with coverage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Full suite
        run: |
          mkdir -p reports
          python -m pytest -q --no-header \
            --cov --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            reports/coverage.xml
            reports/junit.xml
          retention-days: 30

  # =========================================================================
  # STAGE 5 — Security reporting
  # =========================================================================
  security-report:
    name: 'Stage 5 · Aggregated security report'
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit, infrastructure-security]
    # `always()` so a report is still produced when an upstream scanner found
    # something. The gate is the `security-gate` job below -- this job exists
    # to make findings readable, never to decide whether they are acceptable.
    if: always()
    permissions:
      contents: read
      pull-requests: write   # to post the summary comment
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Download scanner reports
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      - name: Normalise, deduplicate and prioritise findings
        run: |
          mkdir -p reports
          cp downloaded/*.json reports/ 2>/dev/null || true
          INPUTS=()
          for f in reports/checkov.json reports/bandit.json \
                   reports/pip-audit.json reports/iam-findings.json; do
            [ -s "$f" ] && INPUTS+=(--input "$f")
          done
          if [ ${#INPUTS[@]} -eq 0 ]; then
            echo 'No scanner reports to aggregate.' | tee reports/triage-report.md
            exit 0
          fi
          python security-automation/finding_triage.py \
            "${INPUTS[@]}" \
            --output reports/triage-report.json \
            --markdown reports/triage-report.md

      - name: Publish to the job summary
        if: always()
        run: |
          {
            echo '## Security scan summary'
            echo
            cat reports/triage-report.md 2>/dev/null || echo 'No report produced.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-triage-report
          path: |
            reports/triage-report.json
            reports/triage-report.md
          retention-days: 90

  # =========================================================================
  # GATE — the single required status check
  # =========================================================================
  security-gate:
    name: 'Security gate'
    runs-on: ubuntu-latest
    needs: [code-quality, codeql, sast, dependency-audit, infrastructure-security, tests, coverage]
    if: always()
    permissions: {}
    steps:
      - name: Verify every stage passed
        # Set this job as the only required status check in branch protection.
        # It fails if ANY upstream job failed, was cancelled, or was skipped --
        # a skipped security job is treated as a failure, because "did not run"
        # must never read as "passed".
        run: |
          declare -A results=(
            ['code-quality']='${{ needs.code-quality.result }}'
            ['codeql']='${{ needs.codeql.result }}'
            ['sast']='${{ needs.sast.result }}'
            ['dependency-audit']='${{ needs.dependency-audit.result }}'
            ['infrastructure-security']='${{ needs.infrastructure-security.result }}'
            ['tests']='${{ needs.tests.result }}'
            ['coverage']='${{ needs.coverage.result }}'
          )
          failed=0
          for stage in "${!results[@]}"; do
            if [ "${results[$stage]}" != 'success' ]; then
              echo "::error::stage '$stage' did not pass (result: ${results[$stage]})"
              failed=1
            else
              echo "ok: $stage"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo 'One or more security stages did not pass. Nothing is auto-suppressed:'
            echo 'fix the finding, or record it as an accepted risk in'
            echo 'assessments/final-security-assessment.md with a targeted, justified'
            echo 'inline exception and a named owner.'
            exit 1
          fi
          echo 'All security stages passed.'
